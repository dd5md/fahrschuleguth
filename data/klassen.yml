# Führerscheinklassen. `home: true` = Karte auf der Startseite. `preis` verweist auf eine Preisliste (preise.yml id),
# `preis_hinweis` ergänzt einen Zusatz, ohne `preis` erscheint der Platzhalter "???" (Preis von Uli nachliefern).
# Quelle der Fahrzeug-Angaben: Bundesverkehrsministerium, "Fahrerlaubnisklassen: Übersicht"
# (bmv.de/SharedDocs/DE/Artikel/StV/Strassenverkehr/fahrerlaubnisklassen-uebersicht.html).
# Mindestalter, Ablauf und BF17: allgemeine Angaben (Fahrerlaubnis-Verordnung), von Uli bestätigen lassen.
- id: b
  kurz: B
  titel: Pkw
  lead: Der Klassiker für Auto, Kleinbus und leichten Anhänger.
  alter: ab 18 Jahren
  darf: 'Kraftfahrzeuge mit einer zulässigen Gesamtmasse von höchstens 3.500 kg, ausgelegt für höchstens acht Personen außer dem Fahrer. Hubraum und Leistung sind nicht begrenzt. Anhänger bis 750 kg zulässiger Gesamtmasse sind immer erlaubt, schwerere nur, wenn die Kombination höchstens 3.500 kg wiegt.'
  ablauf: Theorieunterricht, Fahrstunden inkl. Überland-, Autobahn- und Dunkelheitsfahrten, danach theoretische und praktische Prüfung.
  preis: klasse-b
  home: true
- id: bf17
  kurz: BF17
  titel: Führerschein ab 17
  lead: Mit 17 anfangen und prüfen, mit Begleitung fahren, mit 18 allein.
  alter: ab 17 Jahren
  darf: Fahren in Begleitung einer eingetragenen Person. Mit 18 gilt der Führerschein Klasse B ohne Begleitung.
  ablauf: Ausbildung und Prüfungen wie bei Klasse B. Die Begleitpersonen müssen mindestens 30 Jahre alt sein, seit mindestens 5 Jahren einen Führerschein der Klasse B besitzen und dürfen höchstens einen Punkt im Fahreignungsregister haben.
  preis: klasse-b
  preis_hinweis: gleiche Preise wie Klasse B
  home: true
- id: b96
  kurz: B96
  titel: Pkw mit schwerem Anhänger
  lead: Mehr Gespann-Gewicht, ohne Prüfung.
  alter: Klasse B erforderlich
  darf: Zugfahrzeug der Klasse B mit Anhänger über 750 kg, wenn die Kombination mehr als 3.500 kg und höchstens 4.250 kg wiegt.
  ablauf: Fahrerschulung in der Praxis, keine Prüfung. Voraussetzung ist der Besitz der Klasse B (oder die Erfüllung ihrer Voraussetzungen).
  preis: null
  home: true
- id: b196
  kurz: B196
  titel: 125er mit Pkw-Führerschein
  lead: Mit dem Auto-Führerschein 125er fahren, ohne Prüfung.
  alter: ab 25 Jahren, Klasse B seit mindestens 5 Jahren
  darf: Im Inland Krafträder (auch mit Beiwagen) der Klasse A1, also bis 125 cm³ Hubraum und 11 kW Leistung. Gilt nur in Deutschland.
  ablauf: Fahrerschulung von mindestens 13,5 Zeitstunden (4 Unterrichtseinheiten Theorie und 5 Unterrichtseinheiten Praxis zu je 90 Minuten), keine Prüfung. Der Fahrlehrer bestätigt die Teilnahme.
  preis: null
  home: true
- id: am
  kurz: AM
  titel: Moped und Kleinkraftrad
  lead: Der Einstieg auf zwei und vier Rädern bis 45 km/h.
  alter: ab 16 Jahren
  darf: 'Zweirädrige Kleinkrafträder (Mopeds) mit einer bauartbedingten Höchstgeschwindigkeit von höchstens 45 km/h, einem Hubraum bis 50 cm³ und einer Leistung bis 4 kW. Dazu dreirädrige Kleinkrafträder und vierrädrige Leichtkraftfahrzeuge mit höchstens 45 km/h und zwei Sitzplätzen (einschließlich Fahrer).'
  ablauf: Theorieunterricht, Fahrstunden und Prüfung. Für Mofas und auf 25 km/h begrenzte Fahrzeuge der Klasse AM genügt statt einer Fahrerlaubnis eine Prüfbescheinigung.
  preis: null
  home: true
- id: a1
  kurz: A1
  titel: Leichtkraftrad
  lead: Der Einstieg aufs Motorrad.
  alter: ab 16 Jahren
  darf: 'Krafträder (auch mit Beiwagen) mit einem Hubraum von höchstens 125 cm³, einer Motorleistung von höchstens 11 kW und einem Leistungsgewicht von höchstens 0,1 kW/kg. Dazu dreirädrige Kraftfahrzeuge mit symmetrisch angeordneten Rädern bis 15 kW.'
  ablauf: Theorie, Fahrstunden und praktische Prüfung auf dem Motorrad. Mit zwei Jahren Erfahrung in A1 genügt für den Aufstieg auf A2 eine praktische Prüfung (Stufenführerschein).
  preis: klasse-a1
  home: true
- id: a2
  kurz: A2
  titel: Motorrad bis 35 kW
  lead: Mehr Leistung, Schritt für Schritt.
  alter: ab 18 Jahren
  darf: 'Krafträder (auch mit Beiwagen) mit einer Motorleistung von höchstens 35 kW und einem Leistungsgewicht von höchstens 0,2 kW/kg. Das Fahrzeug darf nicht von einem Kraftrad mit mehr als 70 kW abgeleitet sein. Die Klasse heißt amtlich „A (leistungsbeschränkt)“.'
  ablauf: Theorie, Fahrstunden und praktische Prüfung. Mit zwei Jahren Erfahrung in A2 ist der Aufstieg auf A als Stufenführerschein möglich.
  preis: klasse-a2-a
  home: true
- id: a
  kurz: A
  titel: Motorrad ohne Leistungsgrenze
  lead: Alles fahren dürfen.
  alter: ab 24 Jahren direkt, ab 20 Jahren nach 2 Jahren Klasse A2 (Stufenführerschein)
  darf: Krafträder (auch mit Beiwagen) mit einem Hubraum über 50 cm³ oder einer bauartbedingten Höchstgeschwindigkeit über 45 km/h, ohne Leistungsbegrenzung.
  ablauf: Theorie, Fahrstunden und praktische Prüfung (beim Aufstieg von A2 nur die praktische Prüfung).
  preis: klasse-a2-a
  home: true

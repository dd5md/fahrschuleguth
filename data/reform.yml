# Führerscheinreform: Stand der Planung. Quellen: Bundesregierung (bundesregierung.de, "Reform für einen bezahlbaren und
# modernen Führerschein") und Bundesverkehrsministerium (Pressemitteilung 043/2026). Vor Veröffentlichung gegen den aktuellen
# Stand im Bundestag/Bundesgesetzblatt prüfen. Der Bundestag hat den Gesetzentwurf am 05.11.2026 beschlossen, der Bundesrat muss noch zustimmen; in Kraft ist noch nichts.
stand: '11. November 2026'
hinweis: 'Der Bundestag hat die Änderung des Fahrlehrergesetzes am 5. November 2026 beschlossen. Der Bundesrat muss noch zustimmen, und die zugehörige Verordnung steht noch aus. Bis zum Inkrafttreten gelten die bisherigen Regeln. Inhalte und Termine können sich noch ändern.'
punkte:
  - { titel: 'Theorie digital', text: 'Die Pflicht zum Präsenzunterricht soll entfallen. Das Wissen kann auch digital, zum Beispiel per App, erworben werden. Fahrschulen entscheiden selbst, ob und wie sie Theorieunterricht anbieten.' }
  - { titel: 'Kürzerer Fragenkatalog', text: 'Der Fragenkatalog (derzeit über 1.100 Fragen) soll um rund ein Drittel gekürzt, das Bewertungssystem vereinfacht werden. Fragen zur Verkehrssicherheit bekommen einen Schwerpunkt.' }
  - { titel: 'Sonderfahrten nach Einschätzung des Fahrlehrers', text: 'Die feste Zahl von zwölf Sonderfahrten (Klasse B) soll entfallen. Fahrten über Land, auf der Autobahn und bei Dunkelheit bleiben vorgeschrieben, der Umfang richtet sich nach dem Können. Übungen im Fahrsimulator sollen grundsätzlich möglich sein.' }
  - { titel: 'Prüfungsfahrt mit 25 Minuten Fahrzeit', text: 'Die reine Fahrzeit in der praktischen Prüfung soll auf das EU-Mindestmaß von 25 Minuten zurückgeführt werden.' }
  - { titel: 'Üben mit nahestehenden Personen', text: 'In einer Erprobung (Experimentierklausel) sollen Fahrschüler nach bestandener Theorieprüfung auch mit nahestehenden Personen auf öffentlichen Straßen üben können, ergänzt durch die praktische Ausbildung in der Fahrschule. Die Bundesländer entscheiden, ob sie das umsetzen.' }
  - { titel: 'Preise und Erfolgsquoten', text: 'Preise und Erfolgsquoten aller Fahrschulen sollen künftig online in der Mobilithek, der zentralen Datenbank für Mobilitätsdaten, veröffentlicht werden. Wann und wie genau, ist noch offen.' }
kosten: 'Ein bestimmter Preisvorteil ist nicht garantiert, die Fahrschulen legen ihre Preise weiter selbst fest. Laut Bundesverkehrsministerium kostet der Führerschein Klasse B derzeit im Schnitt rund 3.400 Euro.'
zeitplan:
  - { wann: '20.05.2026', was: 'Kabinett beschließt den Gesetzentwurf zur Änderung des Fahrlehrergesetzes' }
  - { wann: '10.06.2026', was: 'Kabinett beschließt die Verordnung zur Modernisierung der Fahrschulausbildung' }
  - { wann: '05.11.2026', was: 'Der Bundestag beschließt die Änderung des Fahrlehrergesetzes (Gesetzentwurf 21/7404 in der Fassung des Verkehrsausschusses)' }
  - { wann: 'Als Nächstes', was: 'Der Bundesrat muss dem Gesetz und der Verordnung zur Modernisierung der Fahrschulausbildung noch zustimmen' }
  - { wann: '01.07.2027', was: 'Geplantes Inkrafttreten der wesentlichen Änderungen (laut Presseberichten, kein gesichertes Datum)' }

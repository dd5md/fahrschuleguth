# News-Beiträge, neueste zuerst. Solange `posts` leer ist, zeigt /news/ den Hinweis „News folgen in Kürze“.
#
# Beitrag hinzufügen (Beispiel), dann unter `posts:` einfügen und `[]` entfernen:
#
# posts:
# - title: Wir haben bestanden!
#   subtitle: Glückwunsch zur bestandenen Prüfung
#   text: Kurzer Text zum Beitrag.
#   images:                      # Fotos nur mit Einverständnis der abgebildeten Personen
#   - file: news/2026-11/foto-1  # ohne Endung; liegt als .webp (und .jpg) unter source/assets/images/news/
#     alt: Beschreibung des Fotos
posts: []
